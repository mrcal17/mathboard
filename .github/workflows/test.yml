name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Node tests
        run: npm test
      - name: Compile server.py
        run: python -m py_compile server.py
      - name: Server tests
        run: |
          pip install pillow
          python tools/test_server.py
